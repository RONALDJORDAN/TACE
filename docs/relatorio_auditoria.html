 {t:"h2", text:"PARTE 2 — RESUMO COMPLETO EM LINGUAGEM SIMPLES"},
 {t:"p", text:"Esta parte foi escrita para qualquer pessoa entender — mesmo sem saber programar. Cada pergunta é respondida de forma completa, com exemplos do dia a dia."},
 {t:"h3", text:"2.1. O que é o Bot_RPA?"},
 {t:"p", text:"Imagine uma fábrica onde, em vez de pessoas repetindo a mesma tarefa o dia todo, um robô faz tudo sozinho, rápido e sem errar. O Bot_RPA é esse robô, mas em forma de programa de computador. Ele configura tablets (aqueles aparelhos usados nas provas das escolas) automaticamente: instala os aplicativos, coloca as provas dentro, faz o login, escolhe a cidade e deixa tudo pronto para uso."},
 {t:"p", text:"Na tela, a operadora vê uma central de comando: pluga o tablet no cabo USB, aperta um botão (ou deixa no automático) e acompanha o progresso como quem acompanha um pedido de delivery — cada aparelho tem sua barrinha de andamento e seu histórico."},
 {t:"h3", text:"2.2. Para que ele foi criado?"},
 {t:"p", text:"Para acabar com um trabalho cansativo e cheio de erros. Antes do robô, cada tablet precisava ser preparado à mão: instalar o aplicativo de provas, copiar o pacote de avaliações, digitar usuário e senha, escolher o município, ajustar brilho, letra e internet, e ainda anotar o número de série e o endereço de rede (MAC) numa planilha. Com dezenas de tablets por escola, isso levava minutos por aparelho — e bastava um dedo errado para um tablet sair com a prova errada."},
 {t:"p", text:"Com o Bot_RPA, a mesma rotina leva segundos por aparelho, vários tablets são preparados ao mesmo tempo e todos saem idênticos, do primeiro ao último do lote."},
 {t:"h3", text:"2.3. Quando e por quem foi criado?"},
 {t:"p", text:"O projeto nasceu antes de junho de 2026. A versão atual do código começou em 16 de agosto de 2026, criada por Jordan Araujo, e cresceu em etapas (como capítulos de um livro) até setembro de 2026. No dia 25 de setembro de 2026 ele ganhou o nome definitivo: Bot_RPA."},
 {t:"table", head:["Data","O que aconteceu (em palavras simples)"], rows:[
  ["16/08/2026","Nasce a base do programa atual"],
  ["21/08/2026","O programa da bancada ganha atualização pela internet (OTA)"],
  ["26/08/2026","Ganha a central profissional de monitoramento de vários aparelhos"],
  ["11/09/2026","Motores e telas consolidados e organizados"],
  ["25/09/2026","Banco compartilhado entre operadoras, login seguro na nuvem e nome Bot_RPA"]]},
 {t:"h3", text:"2.4. Qual a finalidade? (os 5 objetivos)"},
 {t:"ul", items:[
  "Padronizar 3 modelos de tablet numa mesma linha de produção digital.",
  "Garantir que todo aparelho saia igual: mesmo aplicativo, mesma prova, mesmas configurações.",
  "Rastrear cada tablet pelo número de série e endereço de rede, do computador da bancada até a nuvem e os relatórios.",
  "Manter o próprio programa da bancada atualizado pela internet (OTA). Regra de ouro: todo procedimento no tablet exige o cabo USB conectado — não existe atualização à distância nos aparelhos.",
  "Deixar várias pessoas trabalhando juntas sem criar cadastros duplicados."]},
 {t:"h3", text:"2.5. Em que ele ajudou? (resultados na prática)"},
 {t:"ul", items:[

  "Fim da duplicidade: o sistema reconhece se um tablet já foi cadastrado (pelo número de série ou pelo endereço de rede) e não cria cópia.",
  "Trabalho em equipe: o que uma operadora configura aparece para as colegas e nos relatórios.",
  "Programa sempre novo: o Bot_RPA se atualiza sozinho pela internet, com checagem de segurança. Nos tablets, todo procedimento é via cabo USB.",
  "Prova de tudo: cada lote deixa rastro — dá para auditar o que foi instalado, quando e por quem."]},
 {t:"h3", text:"2.6. Tempo por tablet: antes (à mão) x agora (robô)"},
 {t:"p", text:"Abaixo, o passo a passo real contado por quem fazia à mão, contra o que o robô faz hoje. Tempos manuais são estimativas típicas de bancada; os automatizados vêm do pipeline (polling de 500 ms, dumps de ~100 ms) e das otimizações registradas (+30 s no F1, 8–10 s no F3)."},
 {t:"table", head:["Etapa","Antes: pessoa fazendo à mão","Agora: Bot_RPA"], rows:[

  ["Menu lateral → importar ZIP","~1–2 min: abrir menu, entrar em importar, achar o arquivo e confirmar","Navegação e clique automáticos direto no pacote certo"],
  ["Finalizar: Wi-Fi off, fechar app, desligar","~1 min repetindo em todo tablet","Encerramento automático: limpa tudo, fecha apps, desliga redes e o tablet"],
  ["TOTAL: lote de 10 tablets","~30 min em ritmo (≈3 min/tablet), bem mais com falhas e interrupções","~10 min em 2 levas de 5 + trocas de cabo"]]},
 {t:"p", text:"Na prática: um lote de 10 tablets que consumia cerca de 30 minutos de trabalho manual sem parar — um por vez e com falhas no caminho (dedo errado, arquivo errado, esquecimento de etapa) — sai em cerca de 10 minutos com a ferramenta: 2 levas de 5 tablets, cada um com verificação robótica e correção de erros, com a operadora basicamente trocando os cabos. Ou seja: cerca de 3 vezes mais rápido no relógio, com 5 aparelhos simultâneos, zero erro de digitação e tudo rastreado."},
 {t:"h3", text:"2.7. Como ele foi criado? (a receita)"},
 {t:"p", text:"Como um carro com motor e carroceria separados. O MOTOR, feito numa linguagem chamada C, é a força bruta: conversa com o tablet, enxerga a tela, clica nos botões e instala tudo — rapidíssimo. A INTERFACE, feita em C# (tela bonita do Windows), é o painel do carro: botões, gráficos, relatórios e o mapa da inteligência. Os dois conversam por 36 comandos combinados. Para fabricar o programa final, basta rodar um único comando, que gera o pacote instalável com data e hora da versão."},
 {t:"p", text:"Três regras de ouro sustentam a obra: cada modelo de tablet tem seu código separado (mexer num não quebra o outro), toda mudança é anotada na memória técnica e o programa só é liberado com zero erros e zero avisos."},
 {t:"h3", text:"2.8. E a rede neural BotAI? (explicando sem mistério)"},
 {t:"p", text:"Não é um cérebro de filme de ficção: é um caderninho de estratégias com placar, como uma tabela de campeonato. Para cada botão da tela do tablet (ex: o campo de e-mail), o sistema guarda várias formas de encontrá-lo e dá pontos para as que funcionam — igual a um placar de futebol, de −100 a +100. O mapa 3D colorido mostra esse placar em forma de galáxia: o núcleo no centro, os botões orbitando e as linhas ligando cada botão às suas estratégias. Hoje ele usa estratégias fixas e testadas (modo seguro), e a precisão mostrada é simplesmente a conta de acertos sobre tentativas."},
 {t:"h3", text:"2.9. Principais funcionalidades (o cardápio)"},
 {t:"table", head:["Botão","O que faz (em palavras simples)"], rows:[

  ["F2","Limpa e reinstala, levando internet pelo próprio cabo USB"],
  ["F3","Atualiza só o pacote de provas, sem refazer tudo"],
  ["F4/F5","Trava o tablet para uso de prova e desliga pelo cabo USB"],
  ["F6/F8","Sincroniza dados e mantém conexão ativa"],
  ["Modo automático","Detecta o modelo do tablet e escolhe a rotina certa sozinho"],
  ["Rastreio","Anota série + endereço de rede e manda para a nuvem sem duplicar"],
  ["Atualização (OTA)","Atualiza o programa da bancada pela internet; tablets exigem cabo USB"],
  ["Gestão","Relatórios, etiquetas com QR code, auditoria e o mapa da inteligência"]]},
 {t:"h3", text:"2.10. Números do sistema (o tamanho da obra)"},
 {t:"table", head:["Medida","Valor"], rows:[
  ["Código escrito","27 arquivos de motor + 22 de interface + 12 telas"],
  ["Comandos do motor","36, incluindo as funções F1 a F8 para 3 modelos de tablet"],
  ["Maior rotina","F1 do Vision 7: 2.378 linhas seguindo um passo a passo fixo"],
  ["Cadastro local","Banco que não aceita número de série repetido"],
  ["Nuvem","Banco online com login e proteção contra duplicadas"],
  ["Entrega","Pacote pronto com 1 comando, com data e hora da versão"]]},
 {t:"h2", text:"CONCLUSÃO"},
 {t:"p", text:"O Bot_RPA cumpriu o que prometeu: transformou um trabalho manual, lento e sujeito a erros numa linha de produção confiável. Um lote de 10 tablets que tomava cerca de 30 minutos de uma pessoa — um aparelho por vez, com falhas — sai em cerca de 10 minutos: 2 levas de 5, cada tablet com verificação robótica e correção de erros. Cerca de 3 vezes mais rápido, com todos os aparelhos idênticos, rastreados por número de série e endereço de rede, registrados no banco local, na nuvem e nos relatórios."},
 {t:"p", text:"Somado à atualização automática do próprio programa, ao banco compartilhado entre operadoras e à trilha de auditoria de cada lote, o sistema deixou de ser uma ajuda e virou a base da operação: mais tablets prontos, menos retrabalho e prova documentada de tudo o que foi feito."},

function crc32(buf){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}}
  let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=t[(c^buf[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function u16(n){return [n&255,(n>>8)&255];} function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function strBytes(s){const e=new TextEncoder().encode(s);return Array.from(e);}
function zipStored(files){ // files: [{name, data:number[]}]
  let out=[], central=[], off=0; const FIX=[80,75,5,6];
  files.forEach(f=>{
    const name=strBytes(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=[80,75,3,4, 20,0, 0,0, 0,0, 0,0,0,0].concat(u32(crc),u32(sz),u32(sz),u16(name.length),u16(0)).concat(name);
    out=out.concat(lh,f.data);
    central.push({h:[80,75,1,2, 20,0, 20,0, 0,0, 0,0, 0,0, 0,0].concat(u32(crc),u32(sz),u32(sz),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off)).concat(name), off:off});
    off+=lh.length+sz;
  });
  let cd=[], cdSize=0;
  central.forEach(c=>{cd=cd.concat(c.h);cdSize+=c.h.length;});
  const cdOff=off;
  out=out.concat(cd, FIX, u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdOff),u16(0));
  return new Uint8Array(out);
}

function wp(text,o){o=o||{};const bold=o.bold,size=o.size||24,color=o.color,shd=o.shd,align=o.align||"both",ind=o.indent?'<w:ind w:firstLine="850"/>':"",font=o.font||RFONT;
  return `<w:p><w:pPr><w:jc w:val="${align}"/><w:spacing w:line="360" w:lineRule="auto"/>${ind}</w:pPr>${shd?`<w:pPr><w:shd w:fill="${shd}" w:val="clear"/></w:pPr>`:""}<w:r><w:rPr>${font}${bold?"<w:b/>":""}<w:sz w:val="${size}"/>${color?`<w:color w:val="${color}"/>`:""}</w:rPr><w:t xml:space="preserve">${xesc(text)}</w:t></w:r></w:p>`;}
function wcell(text,bold,shd){return `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${shd?`<w:shd w:fill="${shd}" w:val="clear"/>`:""}<w:tcBorders><w:top w:val="single" w:sz="6"/><w:left w:val="single" w:sz="6"/><w:bottom w:val="single" w:sz="6"/><w:right w:val="single" w:sz="6"/></w:tcBorders></w:tcPr><w:p><w:r><w:rPr>${RFONT}${bold?"<w:b/>":""}<w:sz w:val="20"/></w:rPr><w:t xml:space="preserve">${xesc(text)}</w:t></w:r></w:p></w:tc>`;}
function wtable(head,rows){let s=`<w:p><w:r><w:rPr>${RFONT}<w:sz w:val="20"/></w:rPr><w:t xml:space="preserve"> </w:t></w:r></w:p><w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/></w:tblPr><w:tblGrid>${head.map(()=>`<w:gridCol w:w="3000"/>`).join("")}</w:tblGrid><w:tr>${head.map(h=>wcell(h,true,"D9D9D9")).join("")}</w:tr>`;
  rows.forEach(r=>{s+=`<w:tr>${r.map(c=>wcell(c,false,null)).join("")}</w:tr>`;});return s+"</w:tbl>";}
function buildDocx(){
  let body="";
  DOC.forEach(b=>{
    if(b.t==="cover"){body+=wp(b.title,{bold:true,size:32,align:"center"});b.lines.forEach(l=>{body+=wp(l,{align:"center"});});}
    else if(b.t==="h2"){body+=wp(b.text,{bold:true,size:24,align:"left"});}
    else if(b.t==="h3"){body+=wp(b.text,{bold:true,size:24,align:"left"});}
    else if(b.t==="p"){body+=wp(b.text,{indent:true});}
    else if(b.t==="pre"){b.text.split("\n").forEach(l=>{body+=wp(l,{size:20,align:"left",font:'<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>'});});}
    else if(b.t==="ul"){b.items.forEach(i=>{body+=wp("•  "+i,{align:"left"});});}
    else if(b.t==="table"){body+=wtable(b.head,b.rows);}
  });
  body+=wp("Fim da auditoria · Gerado em 25/09/2026 · Bot_RPA · Robotic Process Automation",{size:20,color:"777777",align:"center"});
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1701" w:bottom="1134" w:left="1701" w:right="1134" w:header="720" w:footer="720"/><w:footerReference w:type="default" r:id="rFooter"/></w:sectPr></w:body></w:document>`;
  const ct=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;
  const footer=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="right"/></w:pPr><w:r><w:rPr>${RFONT}<w:sz w:val="24"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr>${RFONT}<w:sz w:val="24"/></w:rPr><w:instrText xml:space="preserve">PAGE</w:instrText></w:r><w:r><w:rPr>${RFONT}<w:sz w:val="24"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;
  return zipStored([
    {name:"[Content_Types].xml",data:strBytes(ct)},
    {name:"_rels/.rels",data:strBytes(rels)},
    {name:"word/_rels/document.xml.rels",data:strBytes(docRels)},
    {name:"word/footer1.xml",data:strBytes(footer)},
    {name:"word/document.xml",data:strBytes(doc)}
  ]);
}
document.getElementById("btnDocx").addEventListener("click",()=>{
  try{
    const blob=new Blob([buildDocx()],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="auditoria_bot_rpa_20260925.docx";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(e){alert("Falha ao gerar DOCX: "+e.message);}
});
</script>
</body>
</html>
